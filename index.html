<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <!-- Makes the page scale properly on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Etch-a-Sketch Grid</title>

    <!-- Connects this HTML file to the CSS stylesheet -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <h1>Etch-a-Sketch</h1>

    <!-- Button used to ask the user for a new grid size -->
    <button id="resizeButton">Change Grid Size</button>

    <!-- JavaScript will create and insert the grid squares inside this container -->
    <div id="container"></div>

    <!-- 
    Connects this HTML file to the JavaScript file.
    Placing it at the end of the body ensures the HTML loads before the script runs.
  -->
    <script src="script.js"></script>
</body>

</html>
